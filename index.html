<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>VBS Pickup</title>

<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon"
      href="https://cdn.jsdelivr.net/gh/IT-Urbancrest/assets@main/pickupicon180.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* 👉 KEEP ALL YOUR ORIGINAL CSS EXACTLY AS YOU HAD IT */
/* (your glass UI works perfectly — no changes needed) */
</style>

</head>

<body>

<div class="bg"></div>

<div id="toast" class="toast"></div>

<button class="undo-fab" onclick="undoLast()">↺</button>

<div class="container">

  <h1>VBS Pickup</h1>

  <div id="capacityBar" class="capacity">Loading...</div>

  <input id="num" placeholder="Enter Number">

  <button class="a" onclick="submit('A')">LANE A</button>
  <button class="b" onclick="submit('B')">LANE B</button>

  <button class="dismiss" onclick="dismissLane()">Dismiss</button>
  <button class="reset" onclick="resetAll()">Reset</button>

</div>

<script>

const API = "YOUR_EXEC_URL";

async function api(action, params={}) {
  const u = new URL(API);
  u.searchParams.set("action", action);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  return fetch(u).then(r => r.json());
}

async function submit(line) {
  const num = num.value;
  await api("add",{line,number:num});
  num.value="";
  update();
}

async function update() {
  const c = await api("capacity");
  capacityBar.innerText = `${c.total}/${c.max}`;
}

setInterval(update,3000);
update();

</script>

</body>
</html>
