<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>VBS Pickup</title>

<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon"
      href="https://cdn.jsdelivr.net/gh/IT-Urbancrest/assets@main/pickupicon180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VBS Pickup">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* =========================
   BASE / IOS FIX
========================= */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;

  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}

/* =========================
   BACKGROUND
========================= */
.bg {
  position: fixed;
  inset: 0;
  z-index: -2;

  background-image: url("https://www.urbancrest.org/wp-content/uploads/2026/05/Pickup-BG.jpg");
  background-size: cover;
  background-position: center;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;

  background: rgba(0,0,0,0.35);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* =========================
   MAIN LAYOUT (FIXED SPACING)
========================= */
.container {
  position: relative;
  z-index: 1;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  width: 100%;

  height: 100vh;
  height: 100dvh;

  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom));

  gap: clamp(12px, 2vh, 22px);
}

/* Prevent flex collapse weirdness on iOS */
.container > * {
  min-height: 0;
}

/* =========================
   TITLE
========================= */
h1 {
  text-align: center;
  margin: 0;

  font-size: clamp(28px, 6vw, 48px);

  color: white;

  text-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

/* =========================
   CAPACITY
========================= */
.capacity {
  text-align: center;

  font-size: clamp(20px, 4vw, 40px);

  color: white;

  padding: 10px;
  border-radius: 12px;

  background: rgba(255,255,255,0.1);
}

.capacity.full {
  background: rgba(255,0,0,0.35);
}

/* =========================
   INPUT
========================= */
.input-container {
  padding: 8px 0;
}

input {
  width: 100%;

  font-size: clamp(28px, 6vw, 64px);
  padding: clamp(16px, 3vw, 34px);

  text-align: center;

  border-radius: 20px;

  border: 1px solid rgba(255,255,255,0.3);

  background: rgba(255,255,255,0.15);
  color: white;

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  outline: none;
}

/* =========================
   LANE BUTTONS (FIXED SPACING)
========================= */
.lane-buttons {
  display: flex;
  flex-direction: column;

  gap: clamp(14px, 3vh, 28px);

  margin-top: 6px;
  margin-bottom: 6px;
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;

  font-size: clamp(26px, 5.5vw, 56px);
  padding: clamp(18px, 4vw, 48px) 0;

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,0.25);

  background: rgba(255,255,255,0.12);
  color: white;

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.4),
    0 15px 40px rgba(0,0,0,0.5);

  font-weight: 600;
}

.a { background: rgba(3, 184, 66, 0.50); }
.b { background: rgba(3, 118, 184, 0.50); }
.dismiss { background: rgba(184, 3, 50, 0.50); }
.reset { background: rgba(255, 140, 0, 0.55); }

/* =========================
   BOTTOM BUTTONS (BREATHING ROOM FIX)
========================= */
.bottom {
  display: flex;
  flex-direction: column;

  gap: clamp(14px, 2.5vh, 28px);

  padding-top: 6px;
}

/* =========================
   UNDO BUTTON (FIXED SCALE)
========================= */
.undo-fab {
  position: fixed;

  top: calc(16px + env(safe-area-inset-top));
  right: calc(16px + env(safe-area-inset-right));

  width: clamp(64px, 10vw, 96px);
  height: clamp(64px, 10vw, 96px);

  border-radius: 50%;

  font-size: clamp(26px, 4vw, 40px);
  font-weight: 700;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.4),
    0 15px 40px rgba(0,0,0,0.45);

  z-index: 999;
}

/* =========================
   TOAST
========================= */
.toast {
  position: fixed;
  top: 40px;
  left: 50%;
  transform: translateX(-50%);

  padding: 18px 24px;
  border-radius: 14px;

  background: rgba(0,0,0,0.7);
  color: white;

  opacity: 0;
  transition: 0.25s;
}

.toast.show {
  opacity: 1;
}

</style>

</head>

<body>

<div class="bg"></div>

<div id="toast" class="toast"></div>

<button class="undo-fab" onclick="undoLast()">↺</button>

<div class="container">

  <div>

    <h1>VBS Pickup</h1>

    <div id="capacityBar" class="capacity">Loading...</div>

    <div class="input-container">
      <input id="num" placeholder="Enter Number" inputmode="numeric">
    </div>

    <div class="lane-buttons">
      <button class="a" onclick="submit('A')">LANE A</button>
      <button class="b" onclick="submit('B')">LANE B</button>
    </div>

  </div>

  <div class="bottom">
    <button class="dismiss" onclick="dismissLane()">Dismiss Lane</button>
    <button class="reset" onclick="resetAll()">Reset System</button>
  </div>

</div>

<script>

const API = "YOUR_EXEC_URL";

async function api(action, params={}) {
  const url = new URL(API);
  url.searchParams.set("action", action);
  Object.entries(params).forEach(([k,v]) =>
    url.searchParams.set(k,v)
  );
  return fetch(url).then(r => r.json());
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

async function updateCapacity() {
  const c = await api("capacity");

  const bar = document.getElementById("capacityBar");
  bar.innerText = `${c.total} / ${c.max}`;

  bar.classList.toggle("full", c.full);

  document.querySelectorAll("button.a, button.b")
    .forEach(b => b.disabled = c.full);
}

async function submit(line) {
  const num = document.getElementById("num").value;
  if (!num) return toast("Enter number");

  const res = await api("add", { line, number: num });

  document.getElementById("num").value = "";

  toast(res.success ? "Added" : "Error");
}

async function undoLast() {
  await api("undo");
  toast("Undone");
}

async function dismissLane() {
  await api("dismiss");
  toast("Lane dismissed");
}

async function resetAll() {
  const ok = prompt("Type RESET");
  if (ok !== "RESET") return;
  await api("reset");
  toast("Reset complete");
}

setInterval(updateCapacity, 3000);
updateCapacity();

</script>

</body>
</html>
